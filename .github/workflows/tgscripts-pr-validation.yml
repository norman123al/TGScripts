name: TGScripts pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: TGScripts PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check repository and release files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/validate_tgscripts.py --base "$PR_BASE_SHA"
